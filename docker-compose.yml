services:
  postgres:
    image: postgres:16-alpine
    container_name: procureai-postgres
    environment:
      POSTGRES_USER: procureai
      POSTGRES_PASSWORD: procureai
      POSTGRES_DB: procureai
    # Host port 5434: 5432 is the local Postgres service, 5433 is another project on this machine.
    ports:
      - "5434:5432"
    volumes:
      - procureai-pgdata:/var/lib/postgresql/data
      - ./docker/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U procureai -d procureai"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  procureai-pgdata:
